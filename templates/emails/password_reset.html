<!-- templates/emails/password_reset.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #409EFF, #337ECC); padding: 20px; border-radius: 8px 8px 0 0; color: white; text-align: center; }
        .content { background: #f9f9f9; padding: 30px; border-radius: 0 0 8px 8px; }
        .btn { display: inline-block; background: #409EFF; color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; margin: 20px 0; font-weight: 500; }
        .btn:hover { background: #337ECC; }
        .warning { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px; margin: 20px 0; border-radius: 4px; }
        .footer { text-align: center; color: #999; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🔐 {{ site_name }} - 密码重置</h2>
        </div>
        <div class="content">
            <p>您好 <strong>{{ username }}</strong>，</p>
            <p>您请求重置 {{ site_name }} 的登录密码。</p>

            <p style="text-align: center;">
                <a href="{{ reset_url }}" class="btn">重置密码</a>
            </p>

            <p>或复制以下链接到浏览器：</p>
            <p style="word-break: break-all; background: #f0f0f0; padding: 10px; border-radius: 4px;">
                {{ reset_url }}
            </p>

            <div class="warning">
                <strong>⚠️ 安全提示：</strong>
                <ul style="margin: 10px 0 0 20px;">
                    <li>此链接 <strong>{{ expires_hours }}小时内</strong> 有效</li>
                    <li>如果这不是您本人的操作，请忽略此邮件</li>
                    <li>为保障账户安全，请勿将链接分享给他人</li>
                </ul>
            </div>
        </div>
        <div class="footer">
            <p>© {{ site_name }} - 企业内部通讯平台</p>
            <p>此邮件由系统自动发送，请勿回复</p>
        </div>
    </div>
</body>
</html>
