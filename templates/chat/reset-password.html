<!-- templates/chat/reset-password.html -->
<!DOCTYPE html>
<html>
<head>
    <title>重置密码 - {{ site_name|default:'企业聊天室' }}</title>
    <link rel="stylesheet" href="/static/css/auth.css?v=20260822-1491961">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>🔐 设置新密码</h2>

        <form id="resetPasswordForm">
            <!-- 🔧 使用后端传入的参数（优先）或 URL 参数（降级） -->
            <input type="hidden" id="resetToken" value="{{ initial_token }}">
            <input type="hidden" id="resetEmail" value="{{ initial_email }}">

            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" class="form-control" required minlength="8">
                <small class="text-muted">至少8位，建议包含字母、数字和特殊字符</small>
            </div>

            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" class="form-control" required>
            </div>

            <div id="resetError" class="alert alert-danger" style="display: none;"></div>
            <div id="resetSuccess" class="alert alert-success" style="display: none;"></div>

            <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                重置密码
            </button>

            <div class="text-center mt-3">
                <a href="/login/">返回登录</a>
            </div>
        </form>
    </div>
</div>

<script>
    // 🔧 增强：如果后端未传入参数，从 URL 获取（双重保障）
    document.addEventListener('DOMContentLoaded', function () {
        const tokenInput = document.getElementById('resetToken');
        const emailInput = document.getElementById('resetEmail');

        // 如果后端未传入，从 URL 参数获取
        if (!tokenInput.value || !emailInput.value) {
            const params = new URLSearchParams(window.location.search);
            if (!tokenInput.value) tokenInput.value = params.get('token') || '';
            if (!emailInput.value) emailInput.value = params.get('email') || '';
        }

        // 验证令牌是否存在
        if (!tokenInput.value || !emailInput.value) {
            document.getElementById('resetError').textContent = '无效的重置链接';
            document.getElementById('resetError').style.display = 'block';
            document.getElementById('resetBtn').disabled = true;
        }
    });

    // 提交重置
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const token = document.getElementById('resetToken').value;
        const email = document.getElementById('resetEmail').value;

        // 前端验证
        if (newPassword !== confirmPassword) {
            document.getElementById('resetError').textContent = '两次输入的密码不一致';
            document.getElementById('resetError').style.display = 'block';
            return;
        }

        if (newPassword.length < 8) {
            document.getElementById('resetError').textContent = '密码长度至少8位';
            document.getElementById('resetError').style.display = 'block';
            return;
        }

        const resetBtn = document.getElementById('resetBtn');
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';

        try {
            const response = await fetch('/api/auth/confirm_password_reset/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email, token,
                    new_password: newPassword,
                    new_password_confirm: confirmPassword
                })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('resetSuccess').textContent = data.message;
                document.getElementById('resetSuccess').style.display = 'block';
                document.getElementById('resetError').style.display = 'none';

                // 3秒后跳转到登录页
                setTimeout(() => {
                    window.location.href = '/login/';
                }, 3000);
            } else {
                for (const [field, messages] of Object.entries(data)) {
                    if (Array.isArray(messages)) {
                        throw new Error(messages?.[0] || data.error || '重置失败');
                    }
                    if (typeof messages === 'string') {
                        throw new Error(messages || data.error || '重置失败');
                    }
                }
                throw new Error(data.token?.[0] || data.error || '重置失败');
            }
        } catch (error) {
            document.getElementById('resetError').textContent = error.message;
            document.getElementById('resetError').style.display = 'block';
            document.getElementById('resetSuccess').style.display = 'none';
        } finally {
            resetBtn.disabled = false;
            resetBtn.innerHTML = '重置密码';
        }
    });
</script>
</body>
</html>
