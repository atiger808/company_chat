<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无访问权限 - 企业聊天室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #eef2f7 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .no-access {
            text-align: center;
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .no-access .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fef0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f56c6c;
            font-size: 32px;
        }
        .no-access h1 {
            font-size: 20px;
            color: #303133;
            margin-bottom: 10px;
        }
        .no-access p {
            font-size: 14px;
            color: #909399;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .no-access .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 8px;
            background: #409eff;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .no-access .btn:hover { background: #337ecc; }
    </style>
</head>
<body>
<div class="no-access">
    <div class="icon"><i class="fas fa-shield-alt"></i></div>
    <h1>你没有访问权限</h1>
    <p>管理控制台仅限<strong>管理员 / 超级管理员</strong>访问。<br>
       当前账号：{{ username }}，如需开通请联系企业管理员。</p>
    <a class="btn" href="/chat/"><i class="fas fa-arrow-left"></i> 返回聊天室</a>
</div>
</body>
</html>
