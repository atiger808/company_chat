<!-- templates/chat/login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>企业聊天室 - 登录</title>
    <!--    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>-->
    <!--    <script src="https://cdn.jsdelivr.net/npm/sm-crypto@0.3.13/dist/sm4.min.js"></script>-->

    <!--    1. 样式表-->
    <link rel="stylesheet" href="/static/css/auth.css?v=20260415-915d11b">

    <!-- 2. 依赖库 -->
    <script src="/static/js/dist/crypto-js.min.js?v=20260415-915d11b"></script>
    <script src="/static/js/dist/sm4.min.js?v=20260415-915d11b"></script>
    <script src="/static/js/encrypts.js?v=20260415-915d11b"></script>

    <!-- 3. 业务逻辑 -->
    <script src="/static/js/auth.js?v=20260415-915d11b"></script>

    <link rel="icon" type="image/svg+xml" href="/media/avatars/icon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
<div class="login-container">
    <!-- 左侧欢迎区域 -->
    <div class="login-left">
        <div class="logo">
            <i class="fas fa-comments"></i>
            <span>企业聊天室</span>
        </div>
        <div class="welcome-text">
            <h1>欢迎使用企业内部通讯平台</h1>
            <p>安全、高效、实时的企业内部沟通解决方案</p>
        </div>
        <div class="features">
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                <span>端到端加密，保障企业数据安全</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-bolt"></i>
                <span>实时消息推送，毫秒级响应</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-users"></i>
                <span>支持私聊、群聊、部门通讯</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-file-alt"></i>
                <span>文件共享与协作，提升工作效率</span>
            </div>
        </div>
    </div>

    <!-- 右侧表单区域 -->
    <div class="login-right">
        <!-- 登录表单 -->
        <div id="loginForm" class="auth-form">
            <h2>用户登录</h2>
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="loginUsername">用户名或邮箱</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input
                                type="text"
                                id="loginUsername"
                                class="form-control"
                                placeholder="请输入用户名或邮箱"
                                required
                        >
                    </div>
                    <div class="error-message" id="loginUsernameError"></div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input
                                type="password"
                                id="loginPassword"
                                class="form-control"
                                placeholder="请输入密码"
                                required
                        >
                    </div>
                    <div class="error-message" id="loginPasswordError"></div>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> 记住我
                    </label>
                    <a href="#" class="forgot-password" onclick="openForgotPasswordModal()">忘记密码？</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
                    <span class="text">登录</span>
                    <span class="loading"></span>
                </button>

                <div class="error-message" id="loginGeneralError"></div>
                <div class="success-message" id="loginSuccessMessage"></div>
            </form>

<!--                            <div class="switch-form">-->
<!--                                还没有账户？<a href="#" id="showRegisterLink">立即注册</a>-->
<!--                            </div>-->
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="auth-form" style="display: none;">
            <h2>用户注册</h2>
            <form id="registerFormElement">
                <div class="form-group">
                    <label for="registerUsername">用户名</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input
                                type="text"
                                id="registerUsername"
                                class="form-control"
                                placeholder="请输入用户名（3-20个字符）"
                                minlength="3"
                                maxlength="20"
                                required
                        >
                    </div>
                    <div class="error-message" id="registerUsernameError"></div>
                </div>

                <div class="form-group">
                    <label for="registerEmail">邮箱</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input
                                type="email"
                                id="registerEmail"
                                class="form-control"
                                placeholder="请输入邮箱"
                                required
                        >
                    </div>
                    <div class="error-message" id="registerEmailError"></div>
                </div>

                <div class="form-group">
                    <label for="registerPassword">密码</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input
                                type="password"
                                id="registerPassword"
                                class="form-control"
                                placeholder="请输入密码（至少8位）"
                                minlength="8"
                                required
                        >
                    </div>
                    <div class="error-message" id="registerPasswordError"></div>
                </div>

                <div class="form-group">
                    <label for="registerPasswordConfirm">确认密码</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input
                                type="password"
                                id="registerPasswordConfirm"
                                class="form-control"
                                placeholder="请再次输入密码"
                                required
                        >
                    </div>
                    <div class="error-message" id="registerPasswordConfirmError"></div>
                </div>

                <div class="form-group">
                    <label for="registerPhone">手机号（可选）</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input
                                type="tel"
                                id="registerPhone"
                                class="form-control"
                                placeholder="请输入手机号"
                        >
                    </div>
                    <div class="error-message" id="registerPhoneError"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="registerSubmitBtn">
                    <span class="text">注册</span>
                    <span class="loading"></span>
                </button>

                <div class="error-message" id="registerGeneralError"></div>
                <div class="success-message" id="registerSuccessMessage"></div>
            </form>

            <div class="switch-form">
                已有账户？<a href="#" id="showLoginLink">立即登录</a>
            </div>
        </div>
    </div>
</div>


<!-- 忘记密码模态框 -->
<div id="forgotPasswordModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔐 忘记密码</h3>
            <button class="close-btn" onclick="closeForgotPasswordModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p class="text-muted">请输入您的注册邮箱，我们将发送密码重置链接</p>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="resetEmail" class="form-control"
                           placeholder="example@company.com" required>
                </div>

                <div id="resetMessage" class="alert" style="display: block;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="sendResetBtn">
                    发送重置链接
                </button>
            </form>
        </div>
    </div>
</div>

<!-- 重置密码页面（单独的 reset-password.html） -->
<!-- 或在前端路由中实现 -->

<!-- 滑块验证码弹窗 -->
<div class="captcha-modal" id="captchaModal">
    <div class="captcha-modal-content">
        <div class="captcha-modal-header">
            <h3><i class="fas fa-shield-alt"></i> 人机验证</h3>
            <p>请完成滑块验证以继续操作</p>
        </div>
        <div class="captcha-container" id="captchaContainer"></div>
        <div class="captcha-actions">
            <button class="btn btn-secondary" id="captchaCancelBtn">取消</button>
            <button class="btn btn-primary" id="captchaRefreshBtn">
                <i class="fas fa-redo"></i> 换一张
            </button>
        </div>
    </div>
</div>

</body>
</html>
