<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业聊天室 - 用户注册</title>
    <link rel="icon" type="image/svg+xml" href="/media/avatars/cloud-blue.svg?v=20260305-1">

    <!-- 引入项目现有的认证模块样式 -->
    <link rel="stylesheet" href="/static/css/chat_auth.css">
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="login-container">
    <!-- 左侧欢迎区域 -->
    <div class="login-left">
        <a href="/" style="text-decoration: none; color: inherit;">
            <div class="logo">
                <i class="fas fa-cloud"></i>
                <span>企联云</span>
            </div>
        </a>
        <div class="welcome-text">
            <h1>加入企业协作平台</h1>
            <p>安全、高效、实时的企业内部沟通与文档协作解决方案。</p>
        </div>
        <div class="features">
            <div class="feature-item">
                <i class="fas fa-check-circle"></i>
                <span>金融级数据加密，保障企业信息安全</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-check-circle"></i>
                <span>智能网盘支持在线文档多人实时协作</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-check-circle"></i>
                <span>无缝对接企业现有组织架构与通讯录</ each>
            </div>
        </div>
    </div>

    <!-- 右侧表单区域 -->
    <div class="login-right">

        <!-- 👇 新增：返回官网链接 -->
        <a href="/"
           style="display: inline-flex; align-items: center; color: var(--text-light); font-size: 14px; margin-bottom: 24px; text-decoration: none; transition: all 0.2s;"
           onmouseover="this.style.color='var(--primary-color)'"
           onmouseout="this.style.color='var(--text-light)'">
            <i class="fas fa-arrow-left" style="margin-right: 8px; font-size: 12px;"></i> 返回官网主页
        </a>

        <!-- 注册表单 -->
        <form id="registerForm" class="auth-form">
            <h2><i class="fas fa-user-plus" style="color: var(--primary-color); margin-right: 8px;"></i>创建您的账户
            </h2>

            <!-- 用户名 -->
            <div class="form-group">
                <label for="registerUsername">用户名</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="registerUsername" class="form-control" placeholder="3-20位字母、数字或下划线"
                           autocomplete="username">
                </div>
                <div id="registerUsernameError" class="error-message"></div>
            </div>

            <!-- 邮箱 -->
            <div class="form-group">
                <label for="registerEmail">企业邮箱</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="registerEmail" class="form-control" placeholder="name@company.com"
                           autocomplete="email">
                </div>
                <div id="registerEmailError" class="error-message"></div>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="registerPassword">密码</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerPassword" class="form-control" placeholder="至少8位字符"
                           autocomplete="new-password">
                    <i class="fas fa-eye-slash" style="left: auto; right: 12px; cursor: pointer; pointer-events: auto;"
                       onclick="togglePassword('registerPassword', this)"></i>
                </div>
                <div id="registerPasswordError" class="error-message"></div>
            </div>

            <!-- 确认密码 -->
            <div class="form-group">
                <label for="registerPasswordConfirm">确认密码</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerPasswordConfirm" class="form-control"
                           placeholder="请再次输入密码" autocomplete="new-password">
                    <i class="fas fa-eye-slash" style="left: auto; right: 12px; cursor: pointer; pointer-events: auto;"
                       onclick="togglePassword('registerPasswordConfirm', this)"></i>
                </div>
                <div id="registerPasswordConfirmError" class="error-message"></div>
            </div>

            <!-- 手机号 (可选) -->
            <div class="form-group">
                <label for="registerPhone">手机号 <span
                        style="color: var(--text-muted); font-weight: normal;">(可选)</span></label>
                <div class="input-with-icon">
                    <i class="fas fa-mobile-alt"></i>
                    <input type="tel" id="registerPhone" class="form-control" placeholder="11位手机号码"
                           autocomplete="tel">
                </div>
                <div id="registerPhoneError" class="error-message"></div>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">
                <span class="text">立即注册</span>
                <span class="loading"></span>
            </button>

            <!-- 切换登录 -->
            <div class="switch-form">
                已有企业账户？ <a href="/login/">立即登录</a>
            </div>

            <!-- 全局错误提示 -->
            <div id="registerGeneralError" class="alert alert-danger" style="margin-top: 16px;"></
            each>
        </form>
    </div>
</div>

<!-- 滑块验证码模态框 (复用 chat_auth.js 逻辑) -->
<div id="captchaModal" class="captcha-modal">
    <div class="captcha-modal-content">
        <div class="captcha-modal-header">
            <h3><i class="fas fa-shield-alt"></i> 安全验证</h3>
            <p>请完成滑块验证以继续注册操作</p>
        </div>
        <div class="captcha-container" id="captchaContainer">
            <!-- SliderCaptcha 类将在此处动态生成 HTML -->
        </div>
        <div class="captcha-actions">
            <button class="btn btn-secondary" id="captchaCancelBtn">取消</button>
            <button class="btn btn-outline" id="captchaRefreshBtn" style="max-width: 120px;">
                <i class="fas fa-sync-alt"></i> 换一张
            </button>
        </div>
    </div>
</div>

<!-- 引入项目现有的认证逻辑 JS -->
<script src="/static/js/chat_auth.js"></script>

<!-- 页面初始化脚本：确保独立注册页显示正确 -->
<script>
    // 密码可见性切换函数 (供 HTML 内联调用)
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input) {
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    }

    // 确保页面加载时只显示注册表单
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        if (loginForm) loginForm.style.display = 'none';
        if (registerForm) registerForm.style.display = 'block';

        // 动态更新页面标题
        document.title = '企业聊天室 - 用户注册';
    });
</script>
</body>
</html>
