<!-- templates/chat/reset-password-error.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - {{ site_name|default:'企业聊天室' }}</title>
    <link rel="stylesheet" href="/static/css/auth.css?v=20260815-3370f2c">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>❌ 链接无效</h2>
                <p>重置密码链接已过期或不存在</p>
            </div>

            <div class="alert alert-danger show">
                {{ error_message|default:'重置链接已过期或无效，请重新申请' }}
            </div>

            <div class="text-center">
                <a href="/login/" class="btn btn-primary">返回登录</a>
                <a href="/login/#forgot" class="btn btn-secondary" style="margin-top: 12px;">
                    重新申请重置
                </a>
            </div>
        </div>
    </div>
</body>
</html>
