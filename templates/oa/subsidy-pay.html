<script>
    function toggleOaTheme() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        var i = document.querySelector('#themeToggleBtn i');
        if (i) i.className = next === 'light' ? 'fas fa-moon' : 'fas fa-sun';
    }
    function toggleOaUserMenu(e) {
        e.stopPropagation();
        var dd = document.getElementById('oaUserDropdown');
        if (dd) dd.classList.toggle('show');
    }
    function toggleFinanceMenu(e) {
        e.stopPropagation();
        var ud = document.getElementById('oaUserDropdown');
        if (ud) ud.classList.remove('show');
        var dd = document.getElementById('financeSvcDropdown');
        if (dd) dd.classList.toggle('show');
    }
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.oa-user-dropdown') && !e.target.closest('.user-avatar-wrap') && !e.target.closest('#financeSvcWrap')) {
            var ud = document.getElementById('oaUserDropdown');
            if (ud) ud.classList.remove('show');
            var fd = document.getElementById('financeSvcDropdown');
            if (fd) fd.classList.remove('show');
        }
    });
    (function () {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        // 加载当前用户头像
        fetch('/api/auth/me/', {headers: TokenManager.getHeaders()}).then(function (r) { return r.json(); }).then(function (u) {
            var el = document.getElementById('adminAvatar');
            if (el && u && u.avatar_url) el.src = u.avatar_url;
        }).catch(function () {});
    })();
</script>
