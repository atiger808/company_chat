    <style>
        body { margin: 0; background: var(--bg-primary,#f0f2f5); font-family: -apple-system, sans-serif; }
        .mobile-header { display:flex; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid var(--border-color,#e4e7ed); position:sticky; top:0; z-index:10; }
        .mobile-header h1 { font-size:18px; font-weight:600; margin:0; flex:1; }
        .mobile-header .tenant-name { font-size:14px; color:var(--primary-color,#409eff); cursor:pointer; }
        .mobile-search { padding:10px 16px; background:#fff; border-bottom:1px solid var(--border-color,#ebeef5); }
        .mobile-search input { width:100%; padding:10px 12px; border:1px solid var(--border-color,#dcdfe6); border-radius:8px; font-size:14px; outline:none; box-sizing:border-box; }
        .mobile-dept-list { padding:8px 0; }
        .mobile-dept-item { display:flex; align-items:center; gap:12px; padding:14px 16px; background:#fff; margin-bottom:1px; cursor:pointer; }
        .mobile-dept-item:active { background:var(--bg-secondary,#f5f7fa); }
        .mobile-dept-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,#e6a23c,#f0c78a); display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; flex-shrink:0; }
        .mobile-dept-info { flex:1; }
        .mobile-dept-name { font-size:15px; font-weight:500; color:var(--text-primary,#303133); }
        .mobile-dept-meta { font-size:12px; color:var(--text-light,#909399); margin-top:2px; }
        .mobile-dept-arrow { color:var(--text-light,#909399); font-size:14px; }
        .mobile-member-item { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#fff; margin-bottom:1px; }
        .mobile-member-item img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
        .mobile-member-info { flex:1; }
        .mobile-member-name { font-size:15px; font-weight:500; }
        .mobile-member-position { font-size:12px; color:var(--text-light,#909399); }
        .mobile-breadcrumb { display:flex; align-items:center; gap:6px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--border-color,#ebeef5); font-size:13px; overflow-x:auto; white-space:nowrap; }
        .mobile-breadcrumb a { color:var(--primary-color,#409eff); text-decoration:none; }
        .mobile-breadcrumb .current { color:var(--text-primary,#303133); font-weight:500; }
        .tenant-switch-btn { display:flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--border-color,#dcdfe6); border-radius:16px; font-size:13px; cursor:pointer; background:#fff; }
        .tab-bar { display:flex; border-bottom:1px solid var(--border-color,#ebeef5); background:#fff; }
        .tab-bar .tab { flex:1; text-align:center; padding:12px; font-size:14px; cursor:pointer; color:var(--text-secondary,#606266); border-bottom:2px solid transparent; }
        .tab-bar .tab.active { color:var(--primary-color,#409eff); border-bottom-color:var(--primary-color,#409eff); font-weight:500; }
    </style>
</head>

    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
    document.querySelector('.tab[data-tab="'+tab+'"]').classList.add('active');
    document.getElementById('mobileDeptView').style.display = tab === 'dept' ? '' : 'none';
    document.getElementById('mobileChartView').style.display = tab === 'chart' ? '' : 'none';
    if (tab === 'chart') loadMobileChart();
}

async function loadMobileDepts(parentId) {
    var list = document.getElementById('mobileDeptList');
    var breadcrumb = document.getElementById('mobileBreadcrumb');
    try {
        var resp = await fetch(ORG_API_URL+'/departments/', {headers: TokenManager.getHeaders()});
        if (!resp.ok) return;
        var data = await resp.json();
        mobileDepts = data.results || data || [];

        if (parentId) {
            mobileStack.push(parentId);
        } else {
            mobileStack = [];
            breadcrumb.innerHTML = '<a href="javascript:void(0)" onclick="loadMobileRoot()"><i class="fas fa-home"></i> 全部</a>';
        }

        var filtered = mobileDepts.filter(function(d) {
            return parentId ? d.parent === parentId : !d.parent;
        });

        if (!filtered.length) {
            // Show members
            if (parentId) {
                loadMobileMembers(parentId);
                return;
            }
            list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light,#909399);"><i class="fas fa-folder-open" style="font-size:36px;opacity:0.4;"></i><p>暂无部门</p></div>';
            return;
        }

        var html = '';
        filtered.forEach(function(d) {
            var children = mobileDepts.filter(function(c) { return c.parent === d.id; });
            html += '<div class="mobile-dept-item" onclick="loadMobileDepts('+d.id+')">'
                + '<div class="mobile-dept-icon"><i class="fas fa-building"></i></div>'
                + '<div class="mobile-dept-info">'
                + '<div class="mobile-dept-name">' + (d.name||'') + '</div>'
                + '<div class="mobile-dept-meta">' + (d.member_count||0) + '人' + (children.length ? ' · '+children.length+'个子部门' : '') + '</div>'
                + '</div><i class="fas fa-chevron-right mobile-dept-arrow"></i></div>';
        });
        list.innerHTML = html;

        // Update breadcrumb
        if (parentId) {
            var parent = mobileDepts.find(function(d) { return d.id === parentId; });
            if (parent) {
                breadcrumb.innerHTML += ' <span style="color:var(--text-light);">/</span> <span class="current">'+(parent.name||'')+'</span>';
            }
        }
    } catch(e) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:#f56c6c;"><i class="fas fa-exclamation-circle"></i><p>加载失败</p></div>';
    }
}

function loadMobileRoot() {
    mobileStack = [];
    loadMobileDepts(null);
}

async function loadMobileMembers(deptId) {
    var list = document.getElementById('mobileDeptList');
    try {
        var resp = await fetch(ORG_API_URL+'/departments/'+deptId+'/members/?page_size=50', {headers: TokenManager.getHeaders()});
        if (!resp.ok) return;
        var data = await resp.json();
        var members = data.results || [];
        var html = '<div style="padding:8px 16px;font-size:13px;color:var(--text-light,#909399);background:#fff;border-bottom:1px solid var(--border-color,#ebeef5);">部门成员（'+(data.count||0)+'人）</div>';
        members.forEach(function(m) {
            var avatar = m.avatar || '/static/images/default-avatar.png';
            html += '<div class="mobile-member-item">'
                + '<img src="'+avatar+'">'
                + '<div class="mobile-member-info">'
                + '<div class="mobile-member-name">'+(m.real_name||m.username||'')+'</div>'
                + '<div class="mobile-member-position">'+(m.position||'-')+'</div>'
                + '</div>'
                + (m.is_primary ? '<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:#ecf5ff;color:#409eff;">主部门</span>' : '')
                + '</div>';
        });
        if (!members.length) html += '<div style="text-align:center;padding:40px;color:var(--text-light);"><i class="fas fa-users" style="font-size:36px;opacity:0.4;"></i><p>暂无成员</p></div>';
        list.innerHTML = html;
    } catch(e) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:#f56c6c;"><p>加载失败</p></div>';
    }
}

async function loadMobileChart() {
    var container = document.getElementById('mobileChartContainer');
    try {
        var resp = await fetch(ORG_API_URL+'/org-chart/', {headers: TokenManager.getHeaders()});
        if (!resp.ok) return;
        var data = await resp.json();
        var nodes = data.org_chart || [];
        container.innerHTML = '<div style="padding:8px 0;">' + buildMobileTree(nodes) + '</div>';
    } catch(e) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#f56c6c;"><p>加载失败</p></div>';
    }
}

function buildMobileTree(nodes, depth) {
    if (!nodes || !nodes.length) return '';
    depth = depth || 0;
    var html = '<ul style="list-style:none;padding-left:'+(depth>0?'20px':'0')+';margin:0;">';
    nodes.forEach(function(n) {
        var hasCh = n.children && n.children.length;
        html += '<li style="margin:4px 0;">'
            + '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-radius:8px;border-left:3px solid #409eff;font-size:14px;">'
            + '<i class="fas fa-building" style="color:#e6a23c;"></i>'
            + '<span style="font-weight:500;">'+(n.name||'')+'</span>'
            + (n.manager ? '<span style="font-size:12px;color:var(--text-light);">('+n.manager+')</span>' : '')
            + '<span style="margin-left:auto;font-size:12px;color:var(--text-light);">'+(n.member_count||0)+'人</span>'
            + '</div>'
            + (hasCh ? buildMobileTree(n.children, depth+1) : '')
            + '</li>';
    });
    html += '</ul>';
    return html;
}

// Init
document.addEventListener('DOMContentLoaded', function() {
    if (window.tenantManager) tenantManager.init();
    loadMobileDepts(null);

    document.getElementById('mobileOrgSearch').addEventListener('input', function(e) {
        var q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('.mobile-dept-item, .mobile-member-item').forEach(function(item) {
            var text = item.textContent.toLowerCase();
            item.style.display = (!q || text.includes(q)) ? '' : 'none';
        });
    });

    // 移动端折叠/展开按钮
    var mobileFoldBtn = document.getElementById('mobileTreeFoldBtn');
    var mobileFolded = false;
    if (mobileFoldBtn) {
        mobileFoldBtn.onclick = function() {
            mobileFolded = !mobileFolded;
            document.querySelectorAll('.mobile-dept-list > .mobile-dept-item + .mobile-dept-item').forEach(function(el) {
                el.style.display = mobileFolded ? 'none' : '';
            });
            mobileFoldBtn.innerHTML = mobileFolded ? '<i class="fas fa-expand-alt" style="font-size:11px;"></i>' : '<i class="fas fa-compress-alt" style="font-size:11px;"></i>';
            mobileFoldBtn.title = mobileFolded ? '全部展开' : '全部折叠';
        };
    }
});

function showToast(msg, isError) {
    var t = document.getElementById('mobileToast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'mobileToast';
        t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10001;background:rgba(0,0,0,0.7);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;pointer-events:none;opacity:0;transition:opacity 0.3s;';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._t);
    t._t = setTimeout(function(){t.style.opacity='0';}, 2000);
}
</script>
