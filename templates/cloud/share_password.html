<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输入提取码 - 文件分享</title>
    <link rel="icon" type="image/svg+xml" href="/media/avatars/cloud-blue.svg?v=20260305-1">
    <link rel="stylesheet" href="/static/css/chat.css?v=20260807-8591e09">
    <link rel="stylesheet" href="/static/css/cloud.css?v=20260807-8591e09">
    <style>
        .share-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .share-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .share-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .share-header i {
            font-size: 48px;
            color: #409EFF;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #409EFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #337ECC;
        }

        .error-message {
            background: #fef0f0;
            color: #f56c6c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="share-page">
    <div class="share-container">
        <div class="share-header">
            <i class="fas fa-lock"></i>
            <h1>此分享需要提取码</h1>
        </div>

        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/api/cloud/share/{{ share_code }}/">
            {% csrf_token %}
            <input type="hidden" name="action" value="verify">

            <div class="form-group">
                <label>访问提取码</label>
                <input type="password" name="password" placeholder="请输入访问提取码" required autofocus>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-unlock"></i> 验证并查看
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/cloud/" style="color: #666; text-decoration: none;">
                <i class="fas fa-home"></i> 返回首页
            </a>
        </div>
    </div>
</div>
</body>
</html>
