<!-- templates/cloud/cloud_editor.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档编辑 - 企业网盘</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/cloud.css' %}?v={{ static_version|default:'' }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .editor-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            height: 50px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .editor-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .editor-title i {
            font-size: 20px;
            color: #409EFF;
        }

        .editor-title h1 {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .editor-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #409EFF;
            color: white;
        }

        .btn-primary:hover {
            background: #337ECC;
        }

        .btn-secondary {
            background: #f5f7fa;
            color: #606266;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .editor-wrapper {
            flex: 1;
            overflow: hidden;
        }

        #editor-placeholder {
            height: 100%;
            width: 100%;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #909399;
        }

        .loading-state i {
            font-size: 48px;
            margin-bottom: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .save-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #67C23A;
        }

        .save-status.saving {
            color: #E6A23C;
        }

        @media (max-width: 768px) {
            .editor-header {
                height: 40px;
                padding: 0 10px;
            }

            .editor-title h1 {
                font-size: 14px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 200px;
            }

            .editor-actions .btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .collaborator-avatar {
                width: 24px;
                height: 24px;
            }
        }

    </style>
</head>
<body>
<div class="editor-container">
    <header class="editor-header">
        <div class="editor-title">
            <i class="fas fa-file-word" id="docTypeIcon"></i>
            <h1 id="docTitle">加载中...</h1>
        </div>
        <div class="editor-actions">
            <div class="collaborators" id="collaboratorsList"></div>
            <div class="save-status" id="saveStatus">
                <i class="fas fa-check-circle"></i>
                <span>已保存</span>
            </div>
            <button class="btn btn-secondary" onclick="editorApp.showVersions()">
                <i class="fas fa-history"></i> 版本历史
            </button>
            <button class="btn btn-primary" onclick="editorApp.closeEditor()">
                <i class="fas fa-times"></i> 关闭
            </button>
        </div>
    </header>

    <div class="editor-wrapper">
        <div id="loadingState" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>正在加载编辑器...</p>
        </div>
        <div id="editor-placeholder"></div>
    </div>
</div>

<!-- 版本历史模态框 -->
<div id="versionModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
            <h3>版本历史</h3>
            <button class="close-btn" onclick="editorApp.closeVersionModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="versionList"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="editorApp.closeVersionModal()">关闭</button>
        </div>
    </div>
</div>

<script>
    const fileId = new URLSearchParams(window.location.search).get('id');

    const TokenManagerCustom = {
        getToken: () => localStorage.getItem('access_token'),
        getHeaders: () => {
            const token = localStorage.getItem('access_token');
            return {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };
        }
    };

    class DocumentEditorApp {
        constructor(fileId) {
            this.fileId = fileId;
            this.editor = null;
            this.config = null;
            this.init();
        }

        async init() {
            try {
                if (!this.fileId) throw new Error('文件 ID 缺失');
                if (typeof DocsAPI === 'undefined') {
                    throw new Error('OnlyOffice 组件未加载，请刷新页面');
                }


                // 🔧 关键修复：检查 Token
                const token = localStorage.getItem('access_token');
                console.log('🔑 Auth Token:', token ? '存在' : '不存在');

                if (!token) {
                    this.showWarning('未登录，请先登录');
                    window.location.href = '/login/';
                    return;
                }


                const response = await fetch(`/api/cloud/documents/${this.fileId}/edit/`, {
                    headers: TokenManagerCustom.getHeaders()
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    console.error('❌ Edit response error:', error);

                    // 🔧 关键修复：详细的错误提示
                    if (response.status === 403) {
                        throw new Error('您没有权限编辑该文件');
                    } else if (response.status === 404) {
                        throw new Error('文件不存在');
                    } else {
                        throw new Error(error.error || `加载失败：${response.status}`);
                    }
                }


                this.config = await response.json();
                console.log('✅ Config loaded:', this.config);

                // 🔧 验证 config 结构
                if (!this.config.document?.fileType || !this.config.documentType) {
                    throw new Error('文档配置不完整');
                }

                if (!this.config.document?.url) {
                    throw new Error('文件 URL 缺失');
                }

                if (!this.config.editorConfig?.callbackUrl) {
                    throw new Error('回调 URL 缺失');
                }

                // 🔧 验证 fileType 是扩展名（不包含点，全小写）
                const fileType = this.config.document.fileType;
                if (fileType.includes('.') || fileType !== fileType.toLowerCase()) {
                    console.warn('⚠️  建议：fileType 应为小写扩展名，如 "xlsx"');
                }

                // 🔧 验证 documentType 是 OnlyOffice 支持的类型
                const validTypes = ['word', 'cell', 'slide'];
                if (!validTypes.includes(this.config.documentType)) {
                    console.warn(`⚠️  documentType "${this.config.documentType}" 可能无效，应为 ${validTypes.join(', ')}`);
                }

                if (!this.config.document?.url) throw new Error('文档配置不完整');

                // 🔧 关键修复：映射 documentType 到 OnlyOffice 支持的类型
                // const typeMap = {
                //     'word': 'word',
                //     'excel': 'cell',
                //     'ppt': 'slide',
                //     'pdf': 'word',
                // };
                // this.config.documentType = typeMap[this.config.documentType] || this.config.documentType;

                this.updatePageInfo();
                this.initEditor(); // initEditor 内部会在 onReady 时调用 startCollaboratorPolling

            } catch (error) {
                console.error('初始化失败:', error);
                const loadingEl = document.getElementById('loadingState');
                if (loadingEl) {
                    loadingEl.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <p>${error.message}</p>
                    <div style="margin-top:15px;">
                        <button class="btn btn-primary" onclick="location.reload()">重试</button>
                        <button class="btn btn-secondary" onclick="window.close()" style="margin-left:10px;">关闭</button>
                    </div>
                `;
                }
            }
        }

        updatePageInfo() {
            if (!this.config?.document) return;
            document.title = `${this.config.document.title} - 在线编辑`;
            document.getElementById('docTitle').textContent = this.config.document.title;

            const iconMap = {
                'word': 'fa-file-word', 'excel': 'fa-file-excel',
                'ppt': 'fa-file-powerpoint', 'pdf': 'fa-file-pdf',
            };
            const icon = iconMap[this.config.documentType] || 'fa-file';
            document.getElementById('docTypeIcon').className = `fas ${icon}`;
        }

        initEditor() {
            console.log('🔧 初始化编辑器', this.config)
            // 验证 OnlyOffice API
            if (typeof DocsAPI === 'undefined' || typeof DocsAPI.DocEditor !== 'function') {
                console.error('❌ OnlyOffice API 未加载成功');
                return;
            }

            const loadingEl = document.getElementById('loadingState');
            if (loadingEl) loadingEl.style.display = 'none';

            try {
                // 🔧 关键修复：在配置中注册事件回调
                const editorConfig = {
                    ...this.config,
                    events: {
                        onDocumentReady: () => {
                            console.log('✅ 文档就绪');
                        },
                        onDocumentStateChange: (event) => {
                            console.log('状态改变:', event.data);
                            // 🔧 监听保存状态
                            if (event.data) {
                                console.log('💾 Document saving...');
                                this.updateSaveStatus({data: true});
                            } else {
                                console.log('✅ Document saved');
                                this.updateSaveStatus({data: false});
                            }
                        },
                        onRequestClose: () => {
                            console.log('请求关闭');
                            this.closeEditor();
                        },
                        onError: (event) => {
                            // 🔧 关键：记录错误信息
                            console.error('❌ OnlyOffice error:', event);
                            this.showWarning('编辑器错误：' + (event.data?.error || '未知错误'));
                        },
                        onRequestEditRights: () => {
                            console.log('请求编辑权限');
                        },
                        onInfo: (event) => {
                            console.log('信息:', event.data);
                        },
                        onLifeCycle: (event) => {
                            console.log('生命周期:', event.data);
                        }
                    }
                };

                console.log('🔧 配置:', editorConfig);

                // 创建编辑器实例
                this.editor = new DocsAPI.DocEditor('editor-placeholder', editorConfig);

                // 验证编辑器实例（不检查 .on 方法）
                if (!this.editor) {
                    throw new Error('编辑器实例创建失败');
                }

                // // 🔧 注册事件监听器
                // this.editor.on('onRequestClose', () => this.closeEditor());
                // this.editor.on('onDocumentStateChange', (event) => {
                //     this.updateSaveStatus(event.data);
                // });
                // this.editor.on('onReady', () => {
                //     console.log('✅ OnlyOffice 编辑器就绪');
                //     // 🔧 关键：编辑器就绪后开始轮询协作者
                //     this.startCollaboratorPolling();
                // });
                // this.editor.on('onError', (event) => {
                //     console.error('❌ OnlyOffice 编辑器错误:', event);
                // });

                this.startCollaboratorPolling()
                console.log('✅ OnlyOffice 编辑器初始化成功');

            } catch (error) {
                console.error('initEditor failed:', error);
                if (loadingEl) {
                    loadingEl.style.display = 'flex';
                    loadingEl.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>编辑器启动失败：${error.message}</p>
                    <button class="btn btn-primary" onclick="location.reload()">重试</button>
                `;
                }
            }
        }

        updateSaveStatus(data) {
            const statusEl = document.getElementById('saveStatus');
            if (!statusEl) return;
            const icon = statusEl.querySelector('i');
            const text = statusEl.querySelector('span');
            if (data?.data) {
                statusEl.classList.add('saving');
                if (icon) icon.className = 'fas fa-spinner fa-spin';
                if (text) text.textContent = '保存中...';
            } else {
                statusEl.classList.remove('saving');
                if (icon) icon.className = 'fas fa-check-circle';
                if (text) text.textContent = '已保存';
            }
        }

        async showVersions() {
            try {
                const response = await fetch(`/api/cloud/documents/${this.fileId}/versions/`, {
                    headers: TokenManagerCustom.getHeaders()
                });
                if (!response.ok) throw new Error('加载版本失败');

                const data = await response.json();
                this.renderVersionList(data.versions);
                document.getElementById('versionModal').style.display = 'flex';
            } catch (error) {
                this.showWarning('加载版本历史失败：' + error.message);
            }
        }


        // cloud_editor.html - renderVersionList 方法中

        renderVersionList(versions) {
            const container = document.getElementById('versionList');
            if (!versions || versions.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;">暂无版本记录</p>';
                return;
            }

            container.innerHTML = `
                <table style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr style="background:#f5f7fa;">
                            <th style="padding:12px;text-align:left;">版本号</th>
                            <th style="padding:12px;text-align:left;">大小</th>
                            <th style="padding:12px;text-align:left;">创建者</th>
                            <th style="padding:12px;text-align:left;">时间</th>
                            <th style="padding:12px;text-align:center;">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${versions.map(v => `
                            <tr style="border-bottom:1px solid #ebeef5;">
                                <td style="padding:12px;">
                                    v${v.version_number}
                                    ${v.is_current ? '<span style="color:#67C23A;margin-left:5px;">(当前)</span>' : ''}
                                </td>
                                <td style="padding:12px;">${this.formatFileSize(v.file_size)}</td>
                                <td style="padding:12px;">${v.created_by}</td>
                                <td style="padding:12px;">${new Date(v.created_at).toLocaleString('zh-CN')}</td>
                                <td style="padding:12px;text-align:center;">
                                    ${!v.is_current ? `
                                        <button class="btn btn-primary btn-sm"
                                                onclick="editorApp.restoreVersion('${v.id}')"
                                                style="padding:4px 12px;font-size:12px;margin-right:5px;">
                                            恢复此版本
                                        </button>
                                    ` : ''}

                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }


        formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        async restoreVersion(versionId) {

            const confirmed = await this.showConfirmDialog('恢复版本', '确定要恢复到此版本吗？当前内容将被覆盖。', 'confirm');
            if (!confirmed) return;

            try {
                const response = await fetch(`/api/cloud/documents/${this.fileId}/restore_version/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...TokenManagerCustom.getHeaders()
                    },
                    body: JSON.stringify({version_id: versionId})
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '恢复失败');
                }

                this.showSuccess('版本恢复成功！');
                this.closeVersionModal();
                location.reload();
            } catch (error) {
                console.error('error: ', error)
                this.showWarning('恢复版本失败：' + error.message);
            }
        }


        // cloud_editor.html - DocumentEditorApp 类中添加

        /**
         * 🔧 下载指定版本的文件
         * @param {string} versionId - 版本 ID
         * @param {string} filename - 原始文件名（用于显示）
         * @param {number} versionNumber - 版本号
         */
        async downloadVersion(versionId, filename = '', versionNumber = 0) {
            try {
                // 🔧 构建下载 URL
                const downloadUrl = `/api/cloud/documents/versions/${versionId}/download/`;

                // 🔧 显示下载提示
                this.showNotification('info', `正在下载版本 ${versionNumber}...`);

                // 🔧 使用 fetch + blob 方式下载（支持认证）
                const response = await fetch(downloadUrl, {
                    headers: TokenManagerCustom.getHeaders()
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error || `下载失败: ${response.status}`);
                }

                // 🔧 解析文件名（从 Content-Disposition 或 URL）
                let downloadFilename = filename || 'download';
                const disposition = response.headers.get('Content-Disposition');
                if (disposition) {
                    // 解析 filename*=UTF-8''encoded 格式
                    const match = disposition.match(/filename\*=UTF-8''([^;]+)/);
                    if (match) {
                        downloadFilename = decodeURIComponent(match[1]);
                    } else {
                        // 解析 filename="xxx" 格式
                        const match2 = disposition.match(/filename="([^"]+)"/);
                        if (match2) {
                            downloadFilename = match2[1];
                        }
                    }
                }

                // 🔧 获取文件内容并触发下载
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = downloadFilename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 🔧 清理对象 URL
                setTimeout(() => URL.revokeObjectURL(url), 100);

                this.showNotification('success', `版本 ${versionNumber} 下载成功`);

            } catch (error) {
                console.error('下载版本失败:', error);
                this.showNotification('error', `下载失败: ${error.message}`);
            }
        }

        /**
         * 🔧 显示通知消息
         * @param {string} type - 类型: success/error/info
         * @param {string} message - 消息内容
         */
        showNotification(type, message) {
            // 🔧 创建临时通知元素
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 6px;
                color: #fff;
                font-size: 14px;
                z-index: 9999;
                animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
                ${type === 'success' ? 'background: #67C23A' : type === 'error' ? 'background: #F56C6C' : 'background: #909399'}
            `;
            notification.textContent = message;

            // 🔧 添加动画样式
            if (!document.getElementById('notification-styles')) {
                const style = document.createElement('style');
                style.id = 'notification-styles';
                style.textContent = `
                    @keyframes slideIn {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes fadeOut {
                        from { opacity: 1; }
                        to { opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }

            document.body.appendChild(notification);

            // 🔧 3 秒后自动移除
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 3000);
        }


        // cloud_editor.html - DocumentEditorApp 类中添加

        startCollaboratorPolling() {
            // 🔧 立即执行一次
            this.updateCollaborators();

            // 🔧 每 10 秒轮询一次协作者状态
            if (this.collaboratorTimer) {
                clearInterval(this.collaboratorTimer);
            }
            this.collaboratorTimer = setInterval(() => {
                this.updateCollaborators();
            }, 10000);

            console.log('✅ 协作者轮询已启动');
        }

        async updateCollaborators() {
            try {
                const response = await fetch(`/api/cloud/documents/${this.fileId}/collaborators/`, {
                    headers: TokenManagerCustom.getHeaders()
                });
                if (!response.ok) return;

                const data = await response.json();
                this.collaborators = data.collaborators || [];

                // 🔧 渲染协作者头像
                this.renderCollaborators();

            } catch (error) {
                console.error('获取协作者失败:', error);
            }
        }


        renderCollaborators() {
            const container = document.getElementById('collaboratorsList');
            if (!container) return;

            if (!this.collaborators || this.collaborators.length === 0) {
                container.innerHTML = '';
                return;
            }

            // 🔧 渲染协作者头像列表
            container.innerHTML = this.collaborators.map(c => `
                <img src="${c.avatar || '/static/images/default-avatar.png'}"
                     class="collaborator-avatar"
                     title="${c.real_name || c.username} (${c.status})"
                     alt="${c.username}"
                     style="width:28px;height:28px;border-radius:50%;border:2px solid #fff;object-fit:cover;cursor:pointer;"
                     onclick="editorApp.showCollaboratorInfo('${c.user_id}')">
            `).join('');
        }

        showCollaboratorInfo(userId) {
            // 🔧 显示协作者详细信息（可选）
            const collaborator = this.collaborators.find(c => c.user_id === userId);
            if (collaborator) {
                this.showWarning(`${collaborator.real_name || collaborator.username}\n状态: ${collaborator.status}\n最后活动: ${collaborator.last_activity}`);
            }
        }

        // 🔧 清理定时器（防止内存泄漏）
        destroy() {
            if (this.collaboratorTimer) {
                clearInterval(this.collaboratorTimer);
                this.collaboratorTimer = null;
            }
            if (this.editor) {
                this.editor.destroyEditor();
                this.editor = null;
            }
        }


        showError(message) {
            this.showToast(`${message}`, 'error');
        }

        /**
         * 🔧 新增：警告提示
         */
        showWarning(message) {
            this.showToast(`${message}`, 'warning', 5000);
        }

        showSuccess(message) {
            this.showToast(`${message}`, 'success');
        }

        showToast(message, type = 'info', timeout = 3000) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<strong>${type === 'error' ? '错误' : type === 'success' ? '成功' : '提示'}</strong><br>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, timeout);
        }


        // ==================== 优雅的提示对话框（替换 alert） ====================
        showAlert(title, message) {
            return new Promise((resolve) => {
                const dialog = document.createElement('div');
                dialog.className = 'confirm-dialog';
                dialog.innerHTML = `
            <div class="confirm-dialog-content">
                <div class="confirm-dialog-header">
                    <i class="fas fa-info-circle"></i>
                    <h3>${title}</h3>
                    <button class="close-btn" style="margin-left: auto;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="confirm-dialog-body">
                    <p>${message}</p>
                </div>
                <div class="confirm-dialog-footer">
                    <button class="confirm-dialog-btn confirm">确定</button>
                </div>
            </div>
        `;

                document.body.appendChild(dialog);

                const confirmBtn = dialog.querySelector('.confirm');
                const closeBtn = dialog.querySelector('.close-btn');

                const closeDialog = () => {
                    dialog.classList.remove('show');
                    setTimeout(() => {
                        if (dialog.parentNode) {
                            document.body.removeChild(dialog);
                        }
                    }, 300);
                    resolve();
                };

                if (confirmBtn) confirmBtn.addEventListener('click', closeDialog);
                if (closeBtn) closeBtn.addEventListener('click', closeDialog);
                dialog.addEventListener('click', (e) => {
                    if (e.target === dialog) closeDialog();
                });

                setTimeout(() => {
                    dialog.classList.add('show');
                }, 10);
            });
        }


        // ==================== 优雅的确认对话框 ====================
        showConfirmDialog(title, message, type = 'confirm') {
            return new Promise((resolve) => {
                // 创建对话框
                const dialog = document.createElement('div');
                dialog.className = 'confirm-dialog';
                dialog.innerHTML = `
            <div class="confirm-dialog-content">
                <div class="confirm-dialog-header">
                    <i class="fas fa-${type === 'danger' ? 'exclamation-triangle' : type === 'confirm' ? 'check-circle' : 'question-circle'}"></i>
                    <h3>${title}</h3>
                    <button class="close-btn" style="margin-left: auto;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="confirm-dialog-body">
                    <p>${message}</p>
                </div>
                <div class="confirm-dialog-footer">
                    <button class="confirm-dialog-btn cancel">取消</button>
                    <button class="confirm-dialog-btn ${type}">确定</button>
                </div>
            </div>
        `;

                document.body.appendChild(dialog);

                // 获取按钮
                const cancelBtn = dialog.querySelector('.cancel');
                const confirmBtn = dialog.querySelector(`.${type}`);
                const closeBtn = dialog.querySelector('.close-btn');

                // 关闭对话框
                const closeDialog = (result) => {
                    dialog.classList.remove('show');
                    setTimeout(() => {
                        if (dialog.parentNode) {
                            document.body.removeChild(dialog);
                        }
                    }, 300);
                    resolve(result);
                };

                // 事件监听
                if (cancelBtn) {
                    cancelBtn.addEventListener('click', () => closeDialog(false));
                }
                if (closeBtn) {
                    closeBtn.addEventListener('click', () => closeDialog(false));
                }
                if (confirmBtn) {
                    confirmBtn.addEventListener('click', () => closeDialog(true));
                }
                dialog.addEventListener('click', (e) => {
                    if (e.target === dialog) {
                        closeDialog(false);
                    }
                });

                // 显示对话框
                setTimeout(() => {
                    dialog.classList.add('show');
                }, 10);
            });
        }


        closeVersionModal() {
            document.getElementById('versionModal').style.display = 'none';
        }

        async closeEditor() {
            const confirmed = await this.showConfirmDialog('关闭编辑器', '确定要关闭编辑器吗？', 'danger');
            if (!confirmed) return;
            else {
                // 🔧 清理协作者轮询定时器
                if (this.collaboratorTimer) {
                    clearInterval(this.collaboratorTimer);
                    this.collaboratorTimer = null;
                    console.log('🧹 协作者轮询已停止');
                }

                // 🔧 销毁编辑器实例
                if (this.editor) {
                    this.editor.destroyEditor?.();
                    this.editor = null;
                }
                window.location.href = '/cloud/';
            }


        }
    }

    // 初始化
    let editorApp = null;
    if (fileId) {
        editorApp = new DocumentEditorApp(fileId);
        window.editorApp = editorApp;
    }
</script>
</body>
</html>
