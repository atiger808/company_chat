<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务中心 - 义乌吉通集团</title>
    <link rel="icon" type="image/svg+xml" href="/media/avatars/tasks-blue.svg?v=20260820-d0a1b2c">
    <!-- 复用项目基础样式 -->
    <link rel="stylesheet" href="/static/css/chat_auth.css?v=20260822-1491961">
    <link rel="stylesheet" href="/static/css/tasks.css?v=20260822-1491961">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 SortableJS 用于看板拖拽 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

</head>
<body class="task-body">

<!-- 侧边栏遮罩层（移动端） -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="taskApp.toggleSidebar()"></div>

<!-- 顶部导航 -->
<header class="task-header">
    <div class="header-left">
        <button class="nav-btn sidebar-toggle btn-icon" onclick="taskApp.toggleSidebar()" title="切换侧边栏">
            <i class="fas fa-bars"></i>
        </button>
        <a href="/" class="nav-btn btn-text" title="返回官网主页"><i class="fas fa-home"></i> <span class="btn-text">官网</span></a>
        <a href="/chat/" class="nav-btn" title="进入聊天室"><i class="fas fa-comments"></i> <span class="btn-text">聊天室</span></a>
        <a href="/cloud/" class="nav-btn" title="进入企业云网盘"><i class="fas fa-cloud"></i> <span class="btn-text">云网盘</span></a>

        <a href="/oa/approval/" class="nav-btn btn-text"><i class="fas fa-check-double"></i> <span class="btn-text">OA审批</span></a>
        <a href="/oa/attendance/" class="nav-btn btn-text"><i class="fas fa-clock"></i> <span class="btn-text">考勤</span></a>
        <a href="/oa/subsidy/" class="nav-btn"><i class="fas fa-hand-holding-usd"></i> <span class="btn-text">普惠补贴</span></a>
        <a href="/oa/work-calendar/" class="nav-btn"><i class="fas fa-calendar-alt"></i> <span class="btn-text">工作日历</span></a>

    </div>
    <div class="header-center btn-text">
        <h1><i class="fas fa-tasks"></i> 任务中心</h1>
    </div>
    <div class="header-right">
        <button class="btn-icon" id="themeToggleBtn" title="切换主题" onclick="taskApp.toggleTheme()"
                style="border:none;background:transparent;cursor:pointer;font-size:16px;color:var(--text-secondary);">
            <i class="fas fa-moon"></i>
        </button>
        <div class="notif-bell-wrap" id="notifBellWrap" title="工作通知" style="margin-right:4px;">
            <i class="fas fa-bell"></i>
            <span class="notif-badge hide" id="notifBadge">0</span>
        </div>
        <div class="user-info" id="currentUser" title="当前用户" onclick="taskApp.toggleUserDropdown(event)">
            <img src="/static/images/default-avatar.png?v=20260822-1491961" alt="头像" class="user-avatar">
            <span class="user-name btn-text">加载中...</span>
            <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text-light);margin-left:4px;"></i>
            <div class="user-dropdown" id="userDropdown" style="display:none;">
                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/attendance/'">
                    <i class="fas fa-clock"></i> 考勤打卡
                </div>
                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/approval/'">
                    <i class="fas fa-check-double"></i> OA审批
                </div>
                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/subsidy/'">
                    <i class="fas fa-hand-holding-usd"></i> 普惠补贴
                </div>
                <div class="dropdown-divider"></div>

                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/chat/'">
                    <i class="fas fa-comments"></i> 聊天
                </div>
                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/cloud/'">
                    <i class="fas fa-cloud"></i> 网盘
                </div>

                <div class="dropdown-divider"></div>

                <div class="dropdown-item" id="workCalendarBtn" onclick="event.stopPropagation();window.location.href='/oa/work-calendar/'">
                    <i class="fas fa-calendar-alt"></i> 工作日历
                </div>

                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/tasks/'">
                    <i class="fas fa-tasks"></i> 任务
                </div>

                <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/org/'">
                    <i class="fas fa-sitemap"></i> 组织架构
                </div>

                <div class="dropdown-divider"></div>

                <div class="dropdown-item" id="adminConsoleBtn" style="display:none;" onclick="event.stopPropagation();window.location.href='/control/'">
                    <i class="fas fa-shield-alt"></i> 管理控制台
                </div>


                <div class="dropdown-item text-danger" onclick="event.stopPropagation();taskApp.logout()">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </div>
            </div>
        </div>
        <!-- 仅管理员/超级管理员显示「管理控制台」 -->
        <script>
            (function () {
                var t = localStorage.getItem('user_type');
                if (t === 'admin' || t === 'super_admin') {
                    var b = document.getElementById('adminConsoleBtn');
                    if (b) b.style.display = 'flex';
                }
            })();
        </script>
    </div>
</header>

<div class="task-container">
    <!-- 左侧边栏 -->
    <aside class="task-sidebar" id="taskSidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-row">
                <button class="btn btn-primary btn-new-task" onclick="taskApp.openCreateModal()">
                    <i class="fas fa-plus"></i> 新建任务
                </button>
                <button class="sidebar-close-btn" onclick="taskApp.toggleSidebar()" title="关闭侧边栏">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <nav class="task-nav">
            <a class="nav-item active" data-filter="my" onclick="taskApp.switchFilter('my')">
                <i class="fas fa-user"></i> <span>我的任务</span> <span class="badge" id="badge-my">0</span>
            </a>
            <a class="nav-item" data-filter="created" onclick="taskApp.switchFilter('created')">
                <i class="fas fa-paper-plane"></i> <span>我创建的</span> <span class="badge" id="badge-created">0</span>
            </a>
            <a class="nav-item" data-filter="today" onclick="taskApp.switchFilter('today')">
                <i class="fas fa-calendar-day"></i> <span>今日到期</span> <span class="badge" id="badge-today">0</span>
            </a>
            <a class="nav-item" data-filter="done" onclick="taskApp.switchFilter('done')">
                <i class="fas fa-check-circle"></i> <span>已完成</span> <span class="badge" id="badge-done">0</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a class="nav-item" onclick="window.location.href='/oa/attendance/'" style="cursor:pointer;">
                <i class="fas fa-clock"></i> <span>考勤打卡</span>
            </a>
            <a class="nav-item" onclick="window.location.href='/oa/approval/'" style="cursor:pointer;">
                <i class="fas fa-check-double"></i> <span>OA审批</span>
            </a>
            <a class="nav-item" onclick="window.location.href='/oa/subsidy/'" style="cursor:pointer;">
                <i class="fas fa-hand-holding-usd"></i> <span>普惠补贴</span>
            </a>
            <a class="nav-item" onclick="taskApp.logout()" style="cursor:pointer;">
                <i class="fas fa-sign-out-alt" style="color:#f56c6c;"></i> <span style="color:#f56c6c;">退出登录</span>
            </a>
        </div>
    </aside>

    <!-- 右侧主区域 -->
    <main class="task-main">
        <div class="task-toolbar">
            <div class="toolbar-left">
                <h3 id="currentViewTitle">我的任务</h3>
                <input type="text" class="search-input" placeholder="搜索任务..."
                       oninput="taskApp.searchTasks(this.value)">
            </div>
            <div class="view-switcher">
                <button class="btn-icon active" data-view="list" onclick="taskApp.switchView('list')" title="列表视图">
                    <i class="fas fa-list"></i>
                </button>
                <button class="btn-icon" data-view="kanban" onclick="taskApp.switchView('kanban')" title="看板视图">
                    <i class="fas fa-columns"></i>
                </button>
            </div>
        </div>

        <div class="task-content">
            <!-- 列表视图 -->
            <div id="listView" class="list-view"></div>
            <!-- 看板视图 -->
            <div id="kanbanView" class="kanban-view" style="display: none;">
                <div class="kanban-column" data-status="todo">
                    <div class="column-header">待处理 <span class="badge" id="kanban-count-todo">0</span></div>
                    <div class="column-body" id="kanban-todo"></div>
                </div>
                <div class="kanban-column" data-status="in_progress">
                    <div class="column-header">进行中 <span class="badge" id="kanban-count-in_progress">0</span></div>
                    <div class="column-body" id="kanban-in_progress"></div>
                </div>
                <div class="kanban-column" data-status="done">
                    <div class="column-header">已完成 <span class="badge" id="kanban-count-done">0</span></div>
                    <div class="column-body" id="kanban-done"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 右侧详情面板 -->
    <aside class="task-detail-panel" id="taskDetailPanel">
        <div class="detail-header">
            <h3>任务详情</h3>
            <button class="close-btn" onclick="taskApp.closeDetail()">&times;</button>
        </div>
        <div class="detail-body" id="taskDetailBody">
            <div class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <p>选择一个任务查看详情</p>
            </div>
        </div>
    </aside>
</div>

<!-- 创建/编辑任务模态框 (复用之前的逻辑，此处简化) -->
<div id="taskModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3 id="taskModalTitle">新建任务</h3>
            <button class="close-btn" onclick="taskApp.closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="form-group">
                <label>任务标题 *</label>
                <input type="text" id="taskTitle" class="form-control" placeholder="输入任务标题">
            </div>
            <div class="form-group">
                <label>任务描述</label>
                <textarea id="taskDesc" class="form-control" rows="3" placeholder="详细描述..."></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>执行人</label>
                    <div class="assignee-picker">
                        <input type="hidden" id="taskAssigneeId" value="">
                        <div class="assignee-selected" id="taskAssigneeSelected" style="display:none;">
                            <img id="taskAssigneeAvatar" class="assignee-avatar" src="/static/images/default-avatar.png?v=20260822-1491961" alt="头像">
                            <div class="assignee-info">
                                <div class="assignee-name" id="taskAssigneeName"></div>
                                <div class="assignee-meta" id="taskAssigneeMeta"></div>
                            </div>
                            <button type="button" class="assignee-clear" title="取消选择" onclick="taskApp.clearAssignee(event)">&times;</button>
                        </div>
                        <div class="assignee-search">
                            <i class="fas fa-search"></i>
                            <input type="text" id="taskAssigneeSearchInput" class="form-control" placeholder="输入姓名/账号/部门/职位搜索用户...">
                        </div>
                        <div class="assignee-dropdown" id="taskAssigneeDropdown"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>截止日期</label>
                    <input type="datetime-local" id="taskDueDate" class="form-control">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>优先级</label>
                    <select id="taskPriority" class="form-control">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                        <option value="urgent">紧急</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="taskStatus" class="form-control">
                        <option value="todo">待处理</option>
                        <option value="in_progress">进行中</option>
                        <option value="done">已完成</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="taskApp.closeModal()">取消</button>
            <button class="btn btn-primary" onclick="taskApp.saveTask()">保存</button>
        </div>
    </div>
</div>

<script src="/static/js/utils.js?v=20260822-1491961"></script>
<script src="/static/js/api.js?v=20260822-1491961"></script>
<script src="/static/js/tasks.js?v=20260822-1491961"></script>
<script src="/static/js/notifications.js?v=20260822-1491961"></script>

<!-- 🔧 加密依赖：水印配置响应为加密包，需要 EncryptUtils 解密（缺此则水印静默不显示） -->
<script src="/static/js/dist/crypto-js.min.js?v=20260822-1491961"></script>
<script src="/static/js/dist/sm4.min.js?v=20260822-1491961"></script>
<script src="/static/js/encrypts.js?v=20260822-1491961"></script>
<script src="/static/js/watermark.js?v=20260822-c2d3e4f"></script>
<script>WatermarkManager.init();</script>
</body>
</html>
