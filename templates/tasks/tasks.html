<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务中心 - 义乌吉通集团</title>
    <link rel="icon" type="image/svg+xml" href="/media/avatars/tasks-blue.svg?v=20260820-d0a1b2c">

<body class="task-body">

<!-- 侧边栏遮罩层（移动端） -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="taskApp.toggleSidebar()"></div>

<div class="task-container">
    <!-- 左侧边栏 -->

        <div class="sidebar-header">
            <a href="/" class="task-logo" title="返回官网主页">
                <i class="fas fa-tasks"></i>
                <span>任务中心</span>
            </a>
            <button class="sidebar-close-btn" onclick="taskApp.toggleSidebar()" title="关闭侧边栏">

        </div>
        <div class="sidebar-new-task">
            <button class="btn btn-primary btn-new-task" onclick="taskApp.openCreateModal()">
                <i class="fas fa-plus"></i> <span>新建任务</span>
            </button>
        </div>

            <a class="nav-item active" data-filter="my" onclick="taskApp.switchFilter('my')">

            </a>
            <a class="nav-item super-admin-only" data-filter="all" id="navAllTasks" style="display:none;"

                <i class="fas fa-layer-group"></i> <span>全部任务</span> <span class="badge" id="badge-all">0</span>
            </a>
            <a class="nav-item" data-filter="created" onclick="taskApp.switchFilter('created')">
                <i class="fas fa-paper-plane"></i> <span>我创建的</span> <span class="badge" id="badge-created">0</span>
            </a>
            <a class="nav-item" data-filter="today" onclick="taskApp.switchFilter('today')">

            </a>
            <a class="nav-item" data-filter="done" onclick="taskApp.switchFilter('done')">
                <i class="fas fa-check-circle"></i> <span>已完成</span> <span class="badge" id="badge-done">0</span>
            </a>
            <a class="nav-item" data-filter="workorders" onclick="taskApp.switchFilter('workorders')">
                <i class="fas fa-clipboard-list"></i> <span>群工单</span> <span class="badge" id="badge-workorders">0</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a class="btn-back-chat" onclick="window.location.href='/chat/'">
                <i class="fas fa-comments"></i><span>聊天室</span>
            </a>
            <a class="btn-back-chat" onclick="window.location.href='/cloud/'">
                <i class="fas fa-cloud"></i><span>企业网盘</span>
            </a>
            <a class="btn-back-chat" onclick="window.location.href='/oa/attendance/'">
                <i class="fas fa-clock"></i><span>考勤打卡</span>
            </a>
            <a class="btn-back-chat" onclick="window.location.href='/oa/approval/'">
                <i class="fas fa-check-double"></i><span>OA审批</span>
            </a>
            <a class="btn-back-chat" onclick="window.location.href='/oa/subsidy/'">
                <i class="fas fa-hand-holding-usd"></i><span>普惠补贴</span>
            </a>
            <a class="btn-back-chat" onclick="window.location.href='/oa/announcements/'">
                <i class="fas fa-bullhorn"></i><span>集团公告</span>
            </a>
            <a class="btn-logout" onclick="taskApp.logout()">
                <i class="fas fa-sign-out-alt"></i><span>退出登录</span>
            </a>
        </div>
    </aside>

    <!-- 侧边栏拖动分隔条 -->
    <div class="sidebar-splitter" id="taskSplitter" title="拖动调整宽度"></div>

    <!-- 右侧主区域 -->
    <main class="task-main">
        <!-- 顶部栏 -->
        <header class="task-header">
            <div class="header-left">
                <button class="btn-menu" onclick="taskApp.toggleSidebar()" title="打开菜单">
                    <i class="fas fa-indent"></i>
                </button>
                <h1 class="task-page-title"><i class="fas fa-tasks"></i> 任务中心</h1>
            </div>
            <div class="header-right">
                <button class="btn-icon" id="themeToggleBtn" title="切换主题" onclick="taskApp.toggleTheme()">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="/" class="btn-icon" title="官网主页" style="text-decoration:none;color:inherit;">
                    <i class="fas fa-home"></i>
                </a>
                <div class="notif-bell-wrap" id="notifBellWrap" title="工作通知">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge hide" id="notifBadge">0</span>
                </div>
                <div class="user-info" id="currentUser" title="当前用户" onclick="taskApp.toggleUserDropdown(event)">
                    <img src="/static/images/default-avatar.png?v=20261118-79b4cf7" alt="头像" class="user-avatar">
                    <span class="user-name btn-text">加载中...</span>

                    <div class="user-dropdown" id="userDropdown" style="display:none;">

                            <i class="fas fa-clock"></i> 考勤打卡
                        </div>
                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/approval/'">
                            <i class="fas fa-check-double"></i> OA审批
                        </div>
                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/subsidy/'">
                            <i class="fas fa-hand-holding-usd"></i> 普惠补贴
                        </div>

                        <div class="dropdown-divider"></div>

                        <div class="dropdown-item" id="workCalendarBtn" onclick="event.stopPropagation();window.location.href='/oa/work-calendar/'">
                            <i class="fas fa-calendar-alt"></i> 工作日历
                        </div>

                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/work-summary/'">
                            <i class="fas fa-file-signature"></i> 每日工作总结
                        </div>

                        <div class="dropdown-divider"></div>

                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/oa/announcements/'">
                            <i class="fas fa-bullhorn" style="color:#7c4dff;"></i> 集团公告
                        </div>

                        <div class="dropdown-item" id="knowledgeBaseBtn" onclick="event.stopPropagation();window.location.href='/docs/'">
                            <i class="fas fa-book" style="color:#409eff;"></i>
                            <span>企业知识库</span>
                        </div>

                        <div class="dropdown-divider"></div>

                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/chat/'">
                            <i class="fas fa-comments"></i> 聊天
                        </div>
                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/cloud/'">
                            <i class="fas fa-cloud"></i> 网盘
                        </div>

                        <div class="dropdown-divider"></div>

                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/tasks/'">
                            <i class="fas fa-tasks"></i> 任务中心
                        </div>

                        <div class="dropdown-item" onclick="event.stopPropagation();window.location.href='/org/'">
                            <i class="fas fa-sitemap"></i> 组织架构
                        </div>

                        <div class="dropdown-divider"></div>

                        <div class="dropdown-item" id="adminConsoleBtn" style="display:none;" onclick="event.stopPropagation();window.location.href='/control/'">
                            <i class="fas fa-shield-alt"></i> 管理控制台
                        </div>


                        <div class="dropdown-item text-danger" onclick="event.stopPropagation();taskApp.logout()">
                            <i class="fas fa-sign-out-alt"></i> 退出登录
                        </div>
                    </div>

                <!-- 仅管理员/超级管理员显示「管理控制台」 -->
                <script>
                    (function () {
                        var t = localStorage.getItem('user_type');
                        if (t === 'admin' || t === 'super_admin') {

                            if (b) b.style.display = 'flex';

        <div class="task-toolbar">
            <div class="toolbar-left">

                <input type="text" class="search-input" placeholder="搜索任务..."
                       oninput="taskApp.searchTasks(this.value)">
            </div>

            <div class="task-priority-filter" id="taskPriorityFilter" title="按紧急等级筛选">
                <button type="button" class="priority-filter-btn all active" data-priority=""
                        onclick="taskApp.setPriorityFilter('')">全部</button>
                <button type="button" class="priority-filter-btn low" data-priority="low"
                        onclick="taskApp.setPriorityFilter('low')">低</button>
                <button type="button" class="priority-filter-btn medium" data-priority="medium"
                        onclick="taskApp.setPriorityFilter('medium')">中</button>
                <button type="button" class="priority-filter-btn high" data-priority="high"
                        onclick="taskApp.setPriorityFilter('high')">高</button>
                <button type="button" class="priority-filter-btn urgent" data-priority="urgent"
                        onclick="taskApp.setPriorityFilter('urgent')">紧急</button>
            </div>
            <select id="taskStatusFilter" class="form-control task-status-select"
                onchange="taskApp.setTaskStatusFilter(this.value)" title="按任务状态筛选">
                <option value="">全部状态</option>
                <option value="todo">待处理</option>
                <option value="in_progress">进行中</option>
                <option value="done">已完成</option>
                <option value="archived">已归档</option>
            </select>


            <div class="view-switcher">
                <button class="btn-icon active" data-view="list" onclick="taskApp.switchView('list')" title="列表视图">
                    <i class="fas fa-list"></i>
                </button>
                <button class="btn-icon" data-view="kanban" onclick="taskApp.switchView('kanban')" title="看板视图">
                    <i class="fas fa-columns"></i>
                </button>
            </div>
            <div class="wo-toolbar-actions" id="woToolbarActions" style="display:none;">
                <div class="task-priority-filter wo-priority-filter" id="woUrgencyFilterBtns" title="按紧急等级筛选">
                    <button type="button" class="priority-filter-btn all active" data-urgency=""
                            onclick="taskApp.setWoUrgencyFilter('')">全部</button>
                    <button type="button" class="priority-filter-btn low" data-urgency="low"
                            onclick="taskApp.setWoUrgencyFilter('low')">低</button>
                    <button type="button" class="priority-filter-btn medium" data-urgency="medium"
                            onclick="taskApp.setWoUrgencyFilter('medium')">中</button>
                    <button type="button" class="priority-filter-btn high" data-urgency="high"
                            onclick="taskApp.setWoUrgencyFilter('high')">高</button>
                    <button type="button" class="priority-filter-btn urgent" data-urgency="urgent"
                            onclick="taskApp.setWoUrgencyFilter('urgent')">紧急</button>
                </div>
                <select id="woStatusFilter" class="form-control wo-filter-select" onchange="taskApp.loadWorkOrders(1)" title="按工单状态筛选">
                    <option value="">全部状态</option>
                    <option value="pending">待启动</option>
                    <option value="processing">处理中</option>
                    <option value="pending_verify">待核验</option>
                    <option value="done">已闭环</option>
                    <option value="cancelled">已取消</option>
                </select>
                <button class="btn btn-secondary wo-toolbar-btn" id="refreshWorkOrdersBtn" onclick="taskApp.refreshWorkOrders()" title="刷新工单">
                    <i class="fas fa-sync-alt"></i><span class="btn-text">刷新</span>
                </button>
                <button class="btn btn-secondary wo-toolbar-btn" id="exportWorkOrdersBtn" onclick="taskApp.exportWorkOrders()" title="导出工单">
                    <i class="fas fa-download"></i><span class="btn-text">导出</span>
                </button>
            </div>
        </div>

        <div class="task-content">
            <!-- 列表视图 -->
            <div id="listView" class="list-view"></div>
            <!-- 看板视图 -->
            <div id="kanbanView" class="kanban-view" style="display: none;">
                <div class="kanban-column" data-status="todo" title="可拖动任务修改状态">
                    <div class="column-header">待处理 <span class="badge" id="kanban-count-todo">0</span></div>
                    <div class="column-body" id="kanban-todo"></div>
                </div>
                <div class="kanban-column" data-status="in_progress" title="可拖动任务修改状态">
                    <div class="column-header">进行中 <span class="badge" id="kanban-count-in_progress">0</span></div>
                    <div class="column-body" id="kanban-in_progress"></div>
                </div>
                <div class="kanban-column" data-status="done" title="可拖动任务修改状态">
                    <div class="column-header">已完成 <span class="badge" id="kanban-count-done">0</span></div>
                    <div class="column-body" id="kanban-done"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 详情面板拖动分隔条 -->
    <div class="detail-splitter" id="taskDetailSplitter" title="拖动调整详情宽度"></div>

    <!-- 右侧详情面板 -->
    <aside class="task-detail-panel" id="taskDetailPanel">
        <div class="detail-header">
            <h3>任务详情</h3>
            <button class="close-btn" onclick="taskApp.closeDetail()">&times;</button>
        </div>
        <div class="detail-body" id="taskDetailBody">
            <div class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <p>选择一个任务查看详情</p>
            </div>
        </div>
    </aside>
</div>

<!-- 创建/编辑任务模态框 (复用之前的逻辑，此处简化) -->
<div id="taskModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3 id="taskModalTitle">新建任务</h3>
            <button class="close-btn" onclick="taskApp.closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="form-group">
                <label>任务标题 *</label>
                <input type="text" id="taskTitle" class="form-control" placeholder="输入任务标题">
            </div>
            <div class="form-group">
                <label>任务描述</label>
                <textarea id="taskDesc" class="form-control" rows="3" placeholder="详细描述..."></textarea>
            </div>

            <div class="form-group">
                <label>执行人</label>
                <div class="assignee-picker">
                    <input type="hidden" id="taskAssigneeId" value="">
                    <div class="assignee-selected" id="taskAssigneeSelected" style="display:none;">
                        <img id="taskAssigneeAvatar" class="assignee-avatar" src="/static/images/default-avatar.png?v=20261118-79b4cf7" alt="头像">
                        <div class="assignee-info">
                            <div class="assignee-name" id="taskAssigneeName"></div>
                            <div class="assignee-meta" id="taskAssigneeMeta"></div>
                        </div>
                        <button type="button" class="assignee-clear" title="取消选择" onclick="taskApp.clearAssignee(event)">&times;</button>
                    </div>
                    <div class="assignee-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="taskAssigneeSearchInput" class="form-control" placeholder="输入姓名/账号/部门/职位搜索用户...">
                    </div>
                    <div class="assignee-dropdown" id="taskAssigneeDropdown"></div>
                </div>
            </div>
            <div class="form-group">
                <label>截止日期</label>
                <input type="datetime-local" id="taskDueDate" class="form-control">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>优先级</label>
                    <select id="taskPriority" class="form-control">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                        <option value="urgent">紧急</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="taskStatus" class="form-control">
                        <option value="todo">待处理</option>
                        <option value="in_progress">进行中</option>
                        <option value="done">已完成</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-paperclip"></i> 附件</label>
                <div class="task-modal-attach-list" id="newTaskAttachList"></div>
                <label class="task-upload-btn">
                    <i class="fas fa-cloud-upload-alt"></i> 选择附件
                    <input type="file" id="newTaskFileInput" multiple style="display:none;"
                           onchange="taskApp.handleNewTaskFiles(this.files)">
                </label>
                <div class="task-attach-tip">图片可直接预览；文件点击保存到网盘；文档保存后可在线编辑。</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="taskApp.closeModal()">取消</button>
            <button class="btn btn-primary" onclick="taskApp.saveTask()">保存</button>
        </div>
    </div>
</div>

<script>
    // 左侧导航栏 / 详情面板 拖动调整宽度（参考企业网盘主页）
    document.addEventListener('DOMContentLoaded', function () {
        var container = document.querySelector('.task-container');
        if (!container) return;

        // ===== 左侧导航栏 =====
        var sidebar = document.getElementById('taskSidebar');
        var sidebarSplitter = document.getElementById('taskSplitter');
        if (sidebar && sidebarSplitter) {
            var sDragging = false;
            sidebarSplitter.addEventListener('mousedown', function (e) {
                e.preventDefault();
                sDragging = true;
                sidebarSplitter.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', function (e) {
                if (!sDragging) return;
                var rect = container.getBoundingClientRect();
                var newWidth = Math.max(48, Math.min(e.clientX - rect.left, rect.width * 0.4));
                sidebar.style.width = newWidth + 'px';
                sidebar.style.flex = 'none';
                sidebar.classList.toggle('sidebar-narrow', newWidth < 80);
            });

            document.addEventListener('mouseup', function () {
                if (!sDragging) return;
                sDragging = false;
                sidebarSplitter.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });

            // 小屏切换为抽屉时恢复默认宽度/文案，避免窄模式带进手机端
            window.addEventListener('resize', function () {
                if (window.innerWidth <= 768) {
                    sidebar.style.width = '';
                    sidebar.style.flex = '';
                    sidebar.classList.remove('sidebar-narrow');
                }
            });
        }

        // ===== 详情面板 =====
        var panel = document.getElementById('taskDetailPanel');
        var detailSplitter = document.getElementById('taskDetailSplitter');
        if (panel && detailSplitter) {
            var syncDetailSplitter = function () {
                detailSplitter.classList.toggle('show', panel.classList.contains('show'));
            };
            new MutationObserver(syncDetailSplitter).observe(panel, {
                attributes: true,
                attributeFilter: ['class']
            });
            syncDetailSplitter();

            var dDragging = false;
            detailSplitter.addEventListener('mousedown', function (e) {
                if (window.innerWidth <= 1200) return;
                e.preventDefault();
                dDragging = true;
                detailSplitter.classList.add('active');
                panel.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', function (e) {
                if (!dDragging) return;
                var rect = container.getBoundingClientRect();
                var sidebarWidth = sidebar ? sidebar.getBoundingClientRect().width + 5 : 0;
                var maxWidth = Math.max(300, rect.width - sidebarWidth - 360);
                var newWidth = Math.max(300, Math.min(rect.right - e.clientX, maxWidth));
                panel.style.setProperty('--task-detail-width', newWidth + 'px');
            });

            document.addEventListener('mouseup', function () {
                if (!dDragging) return;
                dDragging = false;
                detailSplitter.classList.remove('active');
                panel.classList.remove('resizing');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });
        }
    });
</script>
