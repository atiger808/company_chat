version: '3'
services:
  onlyoffice-document-server:
    image: onlyoffice/document-server:latest
    container_name: onlyoffice-document-server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/var/www/onlyoffice/Data
      - ./logs:/var/log/onlyoffice
      - ./certs:/usr/share/fonts/truetype/custom
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=aa3679f48e7de0cc18200dfc1fa7dd030ce3489999a6ae5fce095f0af8436beb
      - JWT_HEADER=Authorization
      - ONLYOFFICE_HTTPS_HSTS_ENABLED=false
    networks:
      - onlyoffice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  onlyoffice-network:
    driver: bridge